<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tqid.dev</title>
  <meta name="description" content="TheQueenIsDead — Software projects and experiments" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="main.js"></script>
  <script defer src="vendor/js/alpinejs/3.15.12/cdn.min.js"></script>
</head>
<body>
  <div class="app"
       x-data="app([
         { name: 'calora', language: 'Dart', stargazers_count: 1, homepage: '',
           description: '🍏 Flutter nutrition tracker with NZ/AU food database, recipes, and barcode lookup.',
           languages: { Dart: 356203, JavaScript: 247489, Python: 19823, Kotlin: 11666, Swift: 2728, HTML: 1517, 'Objective-C': 38 } },
         { name: 'budge', language: 'Go', stargazers_count: 3, homepage: '',
           description: '🐦 A budget and asset manager for self-hosting Kiwis',
           languages: { Go: 130898, 'Go Template': 66038, JavaScript: 5952, CSS: 3008, Dockerfile: 296 } },
         { name: 'dnscdn', language: 'Go', stargazers_count: 2, homepage: '',
           description: '📁 A CLI tool written in Go for storing and retrieving files on the Domain Name System',
           languages: { Go: 14804 } },
         { name: 'QCKSCRL', language: 'JavaScript', stargazers_count: 0, homepage: 'https://scrl.tqid.dev/',
           description: '📷 A browser based carousel composer for social media',
           languages: { JavaScript: 162717, CSS: 17394, HTML: 8327 } },
         { name: 'QCKCUT', language: 'JavaScript', stargazers_count: 0, homepage: 'https://cut.tqid.dev/',
           description: '🎥 A browser movie editor for clipping and sequencing video highlights',
           languages: { JavaScript: 337311, CSS: 26284, HTML: 15682 } },
         { name: 'gophormula', language: 'Go', stargazers_count: 0, homepage: '',
           description: '🏎️ Golang utilities for everything Formula 1',
           languages: { Go: 76199, CSS: 4374, JavaScript: 3816, 'Go Template': 2662 } },
         { name: 'go-chat', language: 'Go', stargazers_count: 0, homepage: 'https://chat.tqid.dev/',
           description: '💬 A chatroom implemented in Go with NATS and Datastar',
           languages: { Go: 8546, templ: 4268, Dockerfile: 252 } },
         { name: 'gupdit', language: null, stargazers_count: 1, homepage: '',
           description: '⬆️ Check for software updates via Git at runtime' },
       ])"
       x-init="load()">

    <header>
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar-inner">
          <img src="https://avatars.githubusercontent.com/u/30706552?v=4" alt="TheQueenIsDead" />
        </div>
      </div>
      <h1 class="handle">
        <span class="handle-at">@</span><span class="handle-name">TheQueenIsDead</span>
      </h1>
      <p class="bio">Building tools and experiments in Go and beyond.</p>
      <div class="header-links">
        <a class="pill" href="https://github.com/TheQueenIsDead" target="_blank" rel="noopener">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          GitHub
        </a>
      </div>
    </header>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-value" x-text="repos.length"></div>
        <div class="stat-label">Projects</div>
      </div>
      <div class="stat">
        <div class="stat-value" x-text="totalStars"></div>
        <div class="stat-label">Stars</div>
      </div>
      <div class="stat">
        <div class="stat-value" x-text="liveSites"></div>
        <div class="stat-label">Live sites</div>
      </div>
      <div class="stat">
        <div class="stat-value" x-text="primaryLang"></div>
        <div class="stat-label">Primary lang</div>
      </div>
    </div>

    <div class="section-header">
      <span class="section-label">Featured Projects</span>
      <div class="section-line"></div>
    </div>

    <div class="projects-grid">
      <template x-for="repo in repos" :key="repo.name">
        <article class="card" @mousemove="onMouseMove($event, $el)">
          <div class="card-top">
            <!-- Stretched via .card-name::after, so the whole card opens the repo. -->
            <a class="card-name"
               :href="repo.html_url"
               target="_blank"
               rel="noopener"
               :aria-label="repo.name + ' on GitHub'"
               x-text="repo.name"></a>
            <div class="badges">
              <a class="live-badge"
                 x-show="repo.homepage"
                 :href="repo.homepage"
                 target="_blank"
                 rel="noopener"
                 :aria-label="repo.name + ' live site'">
                <span class="live-dot"></span>live
              </a>
            </div>
          </div>
          <p class="card-desc" x-text="repo.description"></p>
          <div class="lang-bar" x-show="breakdown(repo).length">
            <template x-for="lang in breakdown(repo)" :key="lang.name">
              <span class="lang-color"
                    :data-lang="lang.name"
                    :data-percent="lang.percent"
                    :style="'width: ' + lang.percent + '%'"></span>
            </template>
          </div>
          <div class="card-footer">
            <div class="card-meta">
              <span class="lang" x-show="repo.language">
                <span class="lang-dot lang-color" :data-lang="repo.language"></span>
                <span x-text="repo.language"></span>
              </span>
              <span class="stars" x-show="repo.stargazers_count > 0">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                <span x-text="repo.stargazers_count"></span>
              </span>
            </div>
            <svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 16.2 7.8M17 17V7H7"/></svg>
          </div>
        </article>
      </template>
    </div>

    <div class="view-all">
      <a href="https://github.com/TheQueenIsDead?tab=repositories" target="_blank" rel="noopener">
        View all repositories on GitHub
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 16.2 7.8M17 17V7H7"/></svg>
      </a>
    </div>

    <footer>
      <span class="footer-left">tqid.dev</span>
      <div class="footer-right">
        <a href="https://github.com/TheQueenIsDead" target="_blank" rel="noopener">@TheQueenIsDead</a>
        <a href="https://docs.github.com/en/rest" target="_blank" rel="noopener">GitHub API</a>
      </div>
    </footer>

  </div>
</body>
</html>
