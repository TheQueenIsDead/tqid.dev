name: "Memos"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/memos.yml
      - docker/memos.yml
    branches:
      - main

jobs:
  memos:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/networks
      - run: docker compose -f docker/memos.yml up --wait
