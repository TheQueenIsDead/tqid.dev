name: "Alloy"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/alloy.yml
      - docker/alloy.yml
      - etc/alloy/**
    branches:
      - main

jobs:
  alloy:
    runs-on: self-hosted
    env:
      GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
      GRAFANA_LOKI_URL: ${{ vars.GRAFANA_LOKI_URL }}
      GRAFANA_LOKI_USERNAME: ${{ vars.GRAFANA_LOKI_USERNAME }}
      GRAFANA_PROMETHEUS_URL: ${{ vars.GRAFANA_PROMETHEUS_URL }}
      GRAFANA_PROMETHEUS_USERNAME: ${{ vars.GRAFANA_PROMETHEUS_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      # The config is bind-mounted, so a change to etc/alloy alone wouldn't recreate the
      # container, and Alloy doesn't watch its files. Recreate it so every deploy runs the
      # config in the repo; alloy-data keeps log positions and the WAL across restarts.
      # https://github.com/grafana/alloy/issues/508
      - run: docker compose -f docker/alloy.yml up --wait --force-recreate
