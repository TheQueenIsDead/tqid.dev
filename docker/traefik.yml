version: "3.8"

services:
  traefik:
    image: "traefik:v3.7"
    container_name: "traefik"
    restart: "unless-stopped"
    command:
      - "--log.level=INFO"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Containers on several networks must be reached via the shared one, or Traefik may pick an IP it can't route to
      - "--providers.docker.network=docker_default"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=120s"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=120s"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=120s"
      - "--metrics.prometheus"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    expose:
      - "80"
      - "8080"
    labels:
      - "alloy.metrics.scrape=true"
      - "alloy.metrics.port=8080"
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.tqid.dev`)"
      - "traefik.http.routers.dashboard.entrypoints=web"

networks:
  default:
