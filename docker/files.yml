name: "filebrowser"

services:
  # https://filebrowserquantum.com/en/
  files:
    image: "gtstef/filebrowser:beta"
    restart: "unless-stopped"
    environment:
      PUID: "1000"
      PGID: "1000"
    networks:
      - shared
    ports:
      - "5904:80"
    expose:
      - "80"
    volumes:
      # File store, kept at the folder the original filebrowser used
      - "${FILES_FOLDER}/filebrowser:/folder"
      # Database and Cache (`tmp`) per etc/files/config.yaml
      - "${CONFIG_FOLDER}/files:/home/filebrowser/data"
      # Default: https://filebrowserquantum.com/en/docs/getting-started/config/#3-default-locations
      - "../etc/files.config.yaml:/home/filebrowser/data/config.yaml"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.files.rule=Host(`files.tqid.dev`)"
      - "traefik.http.routers.files.entrypoints=web"

networks:
  shared:
    name: docker_default
    external: true