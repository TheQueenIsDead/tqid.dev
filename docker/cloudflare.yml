version: "3.8"

services:
  cloudflare:
    image: "cloudflare/cloudflared:2026.10.0"
    restart: "unless-stopped"
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--metrics"
      - "0.0.0.0:2000"
      - "run"
      - "--token"
      - "${CLOUDFLARE_TOKEN}"
    labels:
      - "alloy.metrics.scrape=true"
      - "alloy.metrics.port=2000"

networks:
  default: