version: "3.8"

services:
  cloudflared:
    image: "cloudflare/cloudflared:2026.10.7"
    container_name: "cloudflared"
    networks:
      - "edge"
      - "ssh"
    # ssh.tqid.dev goes to the host's sshd (terraform/cloudflare/ssh.tf), not a container. Reached
    # at the ssh network's gateway rather than host-gateway, so the connection comes from that
    # network: the host firewall (ansible/nuc.yml) drops port 22 from every other container.
    extra_hosts:
      - "host.docker.internal:10.222.22.1"
    restart: "unless-stopped"
    # The only way in from outside, so keep it alive when something else exhausts the NUC: first
    # call on CPU under contention, memory protected from reclaim, and among the last OOM-killed.
    # It peaks at ~64 MB and 0.1 of a core, so none of this takes anything from the rest.
    cpu_shares: 4096
    mem_reservation: "128m"
    oom_score_adj: -500
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--metrics"
      - "0.0.0.0:2000"
      - "run"
      - "--token"
      - "${CLOUDFLARE_TOKEN}"
    labels:
      - "alloy.metrics.scrape=true"
      - "alloy.metrics.port=2000"

networks:
  edge:
    external: true
  # cloudflared's own route to the host's sshd. Outside Docker's default 172.16/12 address pools so
  # it can't collide with another network, and kept in step with ansible/nuc.yml.
  ssh:
    name: "ssh"
    ipam:
      config:
        - subnet: "10.222.22.0/29"
          gateway: "10.222.22.1"
