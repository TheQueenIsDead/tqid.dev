version: "3.8"

services:
  cloudflared:
    image: "cloudflare/cloudflared:2026.10.7"
    container_name: "cloudflared"
    networks:
      - "edge"
    restart: "unless-stopped"
    # The only way in from outside, so keep it alive when something else exhausts the NUC: first
    # call on CPU under contention, memory protected from reclaim, and among the last OOM-killed.
    # It peaks at ~64 MB and 0.1 of a core, so none of this takes anything from the rest.
    cpu_shares: 4096
    mem_reservation: "128m"
    oom_score_adj: -500
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--metrics"
      - "0.0.0.0:2000"
      - "run"
      - "--token"
      - "${CLOUDFLARE_TOKEN}"
    labels:
      - "alloy.metrics.scrape=true"
      - "alloy.metrics.port=2000"

networks:
  edge:
    external: true
