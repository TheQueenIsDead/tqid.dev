name: alloy

services:
  alloy:
    container_name: alloy
    image: grafana/alloy:v1.20.1
    command:
      - "run"
      - "--server.http.listen-addr=127.0.0.1:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy"
    environment:
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USERNAME: ${GRAFANA_LOKI_USERNAME}
      GRAFANA_PROMETHEUS_URL: ${GRAFANA_PROMETHEUS_URL}
      GRAFANA_PROMETHEUS_USERNAME: ${GRAFANA_PROMETHEUS_USERNAME}
    volumes:
      - '../etc/alloy:/etc/alloy:ro'
      # Persist log positions and the metrics WAL; without it every restart re-sends all container log history
      - 'alloy-data:/var/lib/alloy/data'
      - '/var/run/docker.sock:/var/run/docker.sock'
      # Host filesystems for node metrics
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
      # Docker is snap-installed, so dockerd's / is the snap base image; the real host root is exposed at hostfs
      - '/var/lib/snapd/hostfs:/host/root:ro'
      # systemd journal for syslogs
      - '/var/log/journal:/var/log/journal:ro'
      - '/run/log/journal:/run/log/journal:ro'
      - '/etc/machine-id:/etc/machine-id:ro'
      # cAdvisor needs Docker's data root to identify containers' layers. Docker is
      # snap-installed and cAdvisor uses the path from `docker info`, so mount it 1:1.
      - '/var/snap/docker/common/var-lib-docker:/var/snap/docker/common/var-lib-docker:ro'
    # Host namespaces so node metrics (notably network traffic) reflect the host, not the container
    network_mode: host
    pid: host
    # Host cgroup namespace so cAdvisor can see every container's cgroup
    cgroup: host
    restart: "unless-stopped"
    # Ready once the config has loaded, so `up --wait` fails the deploy on a broken config.
    # /-/healthy is deliberately not used: it fails on transient component errors (e.g. Grafana
    # Cloud rejecting writes). The image has no curl or wget, so bash's /dev/tcp makes the request.
    # Alloy doesn't reload changed config files itself, which is why the deploy recreates the
    # container rather than relying on this to notice a new config.
    #   Endpoints: https://grafana.com/docs/alloy/latest/reference/http/
    #   Image contents: https://github.com/grafana/alloy/blob/main/Dockerfile
    #   No config file watching: https://github.com/grafana/alloy/issues/508
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  alloy-data:
