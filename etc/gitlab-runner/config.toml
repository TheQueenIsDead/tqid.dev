# GitLab Runner config for the lotly group (docker/gitlab-runner.yml, docs/GITLAB.md).
# The runner can't read its token from the environment, so `token` is a placeholder that the
# container replaces with the GITLAB_RUNNER_TOKEN env var on start, writing the result to its own config.toml.

concurrent = 2
check_interval = 5
shutdown_timeout = 300

[[runners]]
  name = "nuc"
  url = "https://gitlab.com"
  token = "__TOKEN__"
  executor = "docker"
  [runners.docker]
    image = "alpine:3.22"
    privileged = false
    disable_cache = false
    # Job caches (pub, pnpm) live in a Docker volume per project between jobs.
    volumes = ["/cache"]
    # The Flutter CI image is 2.3 GB: keep it rather than pulling it for every job.
    pull_policy = ["if-not-present"]
    # Per-job caps, same idea as Tdarr: a runaway build is OOM-killed instead of taking the NUC
    # down. Swap capped at the same value so it fails fast instead of thrashing. 4.5 GB because
    # Flutter's web compile (dart2js) alone peaks around 2.8 GB, and was killed at 3 GB.
    memory = "4608m"
    memory_swap = "4608m"
    cpus = "2"
    # Default is 1024; lower means CI yields the CPU to everything else under contention.
    cpu_shares = 256
    shm_size = 268435456
